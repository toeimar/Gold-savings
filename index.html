// ─── PASSWORD HASHING ──────
async function hashPassword(pass) {
    if (window.crypto && window.crypto.subtle) {
        try {
            const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pass));
            return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
        } catch(e) {
            console.warn("Crypto failed");
        }
    }
    let hash = 0;
    for (let i = 0; i < pass.length; i++) {
        const char = pass.charCodeAt(i);
        hash = ((hash << 5) - hash) + char;
        hash = hash & hash;
    }
    return "fb_" + hash.toString();
}

async function verifyPassword(pass, hash) {
    if (hash.startsWith("fb_")) {
        return await hashPassword(pass) === hash;
    }
    if (window.crypto && window.crypto.subtle) {
        const checkHash = await hashPassword(pass);
        return checkHash === hash;
    }
    if (pass === "123456" && hash === "8d969eef6ecad3c29a3a629280e686cf0c3f5d5a86aff3ca12020c923adc6c92") {
        return true;
    }
    return false;
}

function resetInactivityTimer() {
    if (currentUser) {

}

function activatePinLock() {

}

function updatePinLockDots() {
    for (let i=0; i<4; i++) {
        const dot = document.getElementById('plk'+i);
        if (dot) dot.classList.toggle('filled', i < _pinLockValue.length);
    }
}

function pinLockPress(k) {
    if (k === '') return;
    const errEl = document.getElementById('pin-lock-err');
    if (k === '⌫') {
        _pinLockValue = _pinLockValue.slice(0, -1);
    } else if (_pinLockValue.length < 4) {
        _pinLockValue += k;
    }
    updatePinLockDots();
    if (_pinLockValue.length === 4) {
        if (_pinLockValue === PIN_CODE) {
            document.getElementById('pin-lock-overlay').style.display = 'none';
            _pinLockActive = false;

            overlay.style.animation = 'lockShake 0.4s ease';
        }
    }
}

// ─── LIVE GOLD PRICE ─────────────────────────────────────────
async function fetchLiveGoldPrice() {
    const CACHE_KEY = 'aumthong_goldcache_v3';
    const CACHE_MIN = 15;
    const cached = JSON.parse(sessionStorage.getItem(CACHE_KEY) || 'null');
    if (cached && (Date.now() - cached.ts) < CACHE_MIN * 60 * 1000) {
        window._liveGold = cached; return;
    }
    try {
        const [goldRes, fxRes] = await Promise.all([
            fetch('https://gold-api.com/price/XAU', { signal: AbortSignal.timeout(6000) }),
            fetch('https://open.er-api.com/v6/latest/USD', { signal: AbortSignal.timeout(6000) })
        ]);
        const goldData = await goldRes.json();
        const fxData   = await fxRes.json();
        const priceUSD = goldData.price_gram_24k;
        const usdThb   = fxData.rates?.THB;
        if (!priceUSD || !usdThb) throw new Error('incomplete data');
        const spotTHB = priceUSD * usdThb;
        const s = db.settings;
        let buyRatio = 1.0, sellRatio = 0.99;
        if (s.buyPrice && s.sellPrice) {
            const adminMid = (s.buyPrice + s.sellPrice) / 2;
            buyRatio  = s.buyPrice  / adminMid;
            sellRatio = s.sellPrice / adminMid;
        }
        const result = {
            source: 'live',
            spotTHB: Math.round(spotTHB),
            buyTHB:  Math.round(spotTHB * buyRatio),
            sellTHB: Math.round(spotTHB * sellRatio),
            usdThb:  usdThb.toFixed(2),
            updated: new Date().toLocaleTimeString('th-TH', { hour:'2-digit', minute:'2-digit' }),
            ts: Date.now()
        };
        sessionStorage.setItem(CACHE_KEY, JSON.stringify(result));
        window._liveGold = result;
    } catch(e) {
        console.warn('Gold price fetch failed, using admin price:', e.message);
        window._liveGold = null;
    }
}

function buildSavingsChart(uid) {
    const months = [];
    for (let i=5; i>=0; i--) {
        const d = new Date(); d.setMonth(d.getMonth()-i);
        months.push({ label: d.toLocaleDateString('th-TH',{month:'short'}), month: d.getMonth(), year: d.getFullYear(), v: 0 });
    }
    db.transactions.filter(t=>t.userId===uid && t.status==='approved' && t.type==='deposit').forEach(t => {
        const d = new Date(t.timestamp);
        const m = months.find(x=>x.month===d.getMonth()&&x.year===d.getFullYear());
        if (m) m.v += t.amountTHB;
    });
    return months;
}

function previewSlip(event) {

function submitDeposit() {
    const user = getUser();
    const amt = Number(document.getElementById('dep-amount').value);
    const note = document.getElementById('dep-note').value || 'แจ้งออมทอง';
    if (!amt||amt<=0) return showNotify('กรุณาระบุจำนวนเงิน', 'error');
    if (!tempFile)    return showNotify('กรุณาแนบสลิปหลักฐานการโอน', 'error');
    db.transactions.push({ id:'t'+Date.now(), userId:user.uid, type:'deposit', amountTHB:amt, goldWeight:0, status:'pending', note, timestamp:new Date().toISOString(), slipImage:tempFile });
    saveDB();
    sendTelegramAlert(`📢 <b>แจ้งโอนเงินใหม่ (รอตรวจสอบ)</b>\n👤 ${user.name}\n📱 ${user.phone}\n💰 ฿${fmt.thb(amt)}\n📝 ${note}\n⏰ ${new Date().toLocaleString('th-TH')}`);
    showNotify('ส่งหลักฐานเรียบร้อย'); navigate('home');
}

function approveTx(id) {
    const tx = db.transactions.find(t=>t.id===id);
    const u  = Object.values(db.users).find(usr=>usr.uid===tx.userId);
    const weight = Number(document.getElementById('gold-'+id).value);
    const goldTHBVal = calcGoldTHB(weight);
    tx.status='approved'; tx.goldWeight=weight;
    u.balanceTHB  += tx.amountTHB;
    u.balanceGold += weight;
    saveDB();

    sendTelegramAlert(
        `✅ <b>อนุมัติรายการฝากเงิน</b>\n` +
        `👤 ลูกค้า: ${u.name} (${u.phone})\n` +
        `💰 จำนวนเงิน: ฿${fmt.thb(tx.amountTHB)}\n` +
        `🥇 ทอง: ${fmt.gold(weight)} กรัม (≈ ฿${fmt.thb(goldTHBVal)})\n` +
        `📊 ยอดคงเหลือ: ฿${fmt.thb(u.balanceTHB)} · ${fmt.gold(u.balanceGold)} ก.\n` +
        `⏰ ${new Date().toLocaleString('th-TH')}\n` +
        `✍️ อนุมัติโดย: ${currentUser.name}`
    );

    if (u.telegramChatId) {
        sendTelegramToCustomer(
            u.telegramChatId,
            `🎉 <b>ออมทอง: การฝากเงินของคุณได้รับการอนุมัติแล้ว!</b>\n\n` +
            `💰 จำนวน: ฿${fmt.thb(tx.amountTHB)}\n` +
            `🥇 ทอง: ${fmt.gold(weight)} กรัม\n` +
            `📈 มูลค่าทอง: ≈ ฿${fmt.thb(goldTHBVal)}\n\n` +
            `💼 ยอดสะสมทั้งหมด:\n` +
            `   เงิน: ฿${fmt.thb(u.balanceTHB)}\n` +
            `   ทอง: ${fmt.gold(u.balanceGold)} กรัม\n\n` +
            `ขอบคุณที่ไว้วางใจ ${db.settings.shopName} 🙏`
        );
    }

    showNotify('อนุมัติสำเร็จ ✓ แจ้งเตือนส่งแล้ว'); renderView();
}

function rejectTx(id) {
    const tx=db.transactions.find(t=>t.id===id);
    const u=Object.values(db.users).find(usr=>usr.uid===tx.userId);
    tx.status='rejected'; saveDB();

    sendTelegramAlert(
        `❌ <b>ปฏิเสธรายการฝากเงิน</b>\n` +
        `👤 ${u.name} (${u.phone})\n` +
        `💰 ฿${fmt.thb(tx.amountTHB)}\n` +
        `📝 ${tx.note}\n` +
        `✍️ ปฏิเสธโดย: ${currentUser.name}\n` +
        `⏰ ${new Date().toLocaleString('th-TH')}`
    );

    if (u.telegramChatId) {
        sendTelegramToCustomer(
            u.telegramChatId,
            `⚠️ <b>ออมทอง: รายการฝากเงินถูกปฏิเสธ</b>\n\n` +
            `💰 จำนวน: ฿${fmt.thb(tx.amountTHB)}\n` +
            `📝 หมายเหตุ: ${tx.note}\n\n` +
            `กรุณาตรวจสอบหลักฐานการโอนและส่งใหม่อีกครั้ง\n` +
            `หรือติดต่อแอดมินที่ ${db.settings.phoneContact || 'เบอร์ร้าน'}`
        );
    }

    showNotify('ปฏิเสธรายการแล้ว', 'warning'); renderView();
}

function saveAdminSettings() {
    const s = db.settings;
    s.shopName      = document.getElementById('set-name').value;
    s.shopTagline   = document.getElementById('set-tag').value;
    s.shopLink      = document.getElementById('set-link').value;
    s.bankName      = document.getElementById('set-bank-name').value;
    s.accountName   = document.getElementById('set-acc-name').value;
    s.accountNumber = document.getElementById('set-acc-num').value;
    s.phoneContact  = document.getElementById('set-phone').value;
    s.lineContact   = document.getElementById('set-line').value;
    
    if (currentUser.role==='superadmin') {
        s.tgChatId       = document.getElementById('set-tg-chat-id').value;
        s.backupEmail    = document.getElementById('set-backup-email').value;
        s.buyPrice       = Number(document.getElementById('set-buy').value);
        s.sellPrice      = Number(document.getElementById('set-sell').value);
        s.pinLockEnabled = document.getElementById('set-pin-lock').value === 'true';
        s.pinLockTimeout = Number(document.getElementById('set-pin-timeout').value) || 5;

    saveDB(); updateShopIdentity(); showNotify('บันทึกสำเร็จ'); navigate('home');
}

    `;

function saveUserEditAdmin(phone) {
    const u = db.users[phone];
    const roleEl = document.getElementById('ed-role');
    const newRole = (roleEl && !roleEl.disabled) ? roleEl.value : u.role;

    // FEATURE 2: PIN Validation for Role Escalation
    if ((newRole === 'admin' || newRole === 'superadmin') && u.role !== newRole) {
        openPinModal(`ยืนยันการให้สิทธิ์ผู้ดูแลระบบ`, (pin) => {
            if (pin !== '1234') return showNotify('PIN ไม่ถูกต้อง (ใช้ 1234)', 'error');
            proceedSaveUserEditAdmin(phone, newRole);
        });
    } else {
        proceedSaveUserEditAdmin(phone, newRole);
    }
}

function proceedSaveUserEditAdmin(phone, newRole) {
    const u = db.users[phone];
    u.name          = document.getElementById('ed-name').value;
    u.email         = document.getElementById('ed-email').value;
    u.balanceTHB    = Number(document.getElementById('ed-thb').value);
    u.balanceGold   = Number(document.getElementById('ed-gold').value);
    u.telegramChatId = document.getElementById('ed-tg-id').value.trim() || null;
    u.role          = newRole;
    saveDB(); 
    showNotify('อัปเดตข้อมูลเรียบร้อย'); 
    closeModal(); 
    renderView();
}

function confirmDeleteUser(phone) {
    if (currentUser.role!=='superadmin') return showNotify('เฉพาะแอดมินหลักเท่านั้น','error');
    const target = db.users[phone];
    openPinModal(`ยืนยันลบ "${target.name}"`, (pin) => {
        if (pin !== '1234') return showNotify('PIN ไม่ถูกต้อง (ใช้ 1234)', 'error');
        executeDeleteUser(phone);
    });
}

function executeDeleteUser(phone) {
    const target = db.users[phone];
    db.transactions = db.transactions.filter(t=>t.userId!==target.uid);
    delete db.users[phone];
    saveDB();
    sendTelegramAlert(`🗑 <b>ลบผู้ใช้</b>\nชื่อ: ${target.name}\nเบอร์: ${target.phone}`);
    showNotify('ลบผู้ใช้งานเรียบร้อย');
    closeModal(); renderView();
}

let _pinCallback = null;

function openPinModal(title, callback) {
    _pinCallback = callback; _pinValue = '';
    const modal = document.getElementById('modal-content');
    modal.innerHTML = ` 
        <h3 style="text-align:center;margin-bottom:5px;color:var(--text);">${title}</h3> 
        <p style="text-align:center;font-size:0.8rem;color:var(--text3);margin-bottom:5px;">กรอก PIN เพื่อยืนยัน</p> 
        <div class="pin-display"> 
            <div class="pin-dot" id="pd0"></div> 
            <div class="pin-dot" id="pd1"></div> 
            <div class="pin-dot" id="pd2"></div> 
            <div class="pin-dot" id="pd3"></div> 
        </div> 
        <div class="pin-pad"> 
            ${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>`
            <button class="pin-btn ${k==='⌫'?'danger':''}"
            onclick="pinPress('${k}')" ${k===''?'style="visibility:hidden"':''}>
            ${k}
            </button>`).join('')} 
        </div> 
        <button class="btn btn-outline" style="margin-top:15px;" onclick="closeModal()">ยกเลิก</button> 
    `;
    document.getElementById('modal-overlay').style.display='flex';
}

function pinPress(k) {
    if (k==='') return;
    if (k==='⌫') { _pinValue=_pinValue.slice(0,-1); }
    else if (_pinValue.length<4) { _pinValue+=k; }
    for(let i=0;i<4;i++) {
        const dot=document.getElementById('pd'+i);
        if(dot) dot.classList.toggle('filled', i<_pinValue.length);
    }
    if (_pinValue.length===4) {
        setTimeout(()=>{ _pinCallback && _pinCallback(_pinValue); }, 200);
    }
}

// ─── EXPORT CSV ───────────────────────────────────────────────
function generateCSVContent(filterUid=null) {
    const rows=[["วันที่","ชื่อลูกค้า","เบอร์โทร","อีเมล","รายการ","จำนวนเงิน(บาท)","จำนวนทอง(กรัม)","มูลค่าทอง(บาท)","สถานะ","ยอดเงินสะสม(บาท)","ยอดทองสะสม(กรัม)"]];
    const txs = filterUid ? db.transactions.filter(t=>t.userId===filterUid) : db.transactions;
    const p = getGoldPrice();
    txs.forEach(t=>{
        const u=Object.values(db.users).find(usr=>usr.uid===t.userId)||{};
        const goldTHBVal = (t.goldWeight||0) * p.sell;
        rows.push([
            `"${new Date(t.timestamp).toLocaleString('th-TH')}"`,
            `"${u.name||'?'}"`, `="${u.phone||''}"`, `"${u.email||''}"`,
            `"${t.note||''}"`, t.amountTHB, t.goldWeight||0,
            goldTHBVal.toFixed(2),
            t.status==='approved'?'สำเร็จ':t.status==='rejected'?'ปฏิเสธ':'รอยืนยัน',
            u.balanceTHB||0, u.balanceGold||0
        ]);
    });
    return "\ufeff"+rows.map(r=>r.join(",")).join("\n");
}

function triggerManualBackup() {
    if (currentUser.role!=='superadmin') return showNotify('คุณไม่มีสิทธิ์','error');
    
    // FEATURE 3: Download full data and send to Telegram (simulating email flow)
    const csv = generateCSVContent();
    const fn = `รายงานออมทองรวม_${new Date().toLocaleDateString('th-TH').replace(/\//g,'-')}.csv`;
    
    // ดาวน์โหลดลงเครื่อง
    downloadCSV(csv, fn);
    
    // ส่งเข้า Telegram กลุ่มหากมีการตั้งค่าไว้
    if (db.settings.tgChatId) {
        sendTelegramDocument(csv, fn);
        showNotify('ดาวน์โหลดและส่งไฟล์รวมเข้า Telegram สำเร็จ');
    } else {
        showNotify('ดาวน์โหลดสำเร็จ (ไม่ได้ส่ง TG เพราะไม่ได้ตั้งค่า Chat ID)');
    }
}

function exportUserCSV(uid) {
    if (currentUser.role!=='superadmin') return showNotify('คุณไม่มีสิทธิ์','error');
    const user=Object.values(db.users).find(u=>u.uid===uid);
    downloadCSV(generateCSVContent(uid), `ออมทอง_${user.name}_${new Date().toLocaleDateString('th-TH').replace(/\//g,'-')}.csv`);
}

function downloadCSV(csvContent, filename) {
    const blob=new Blob([csvContent],{type:'text/csv;charset=utf-8;'});
    const link=document.createElement("a");
    link.href=URL.createObjectURL(blob); link.download=filename; link.click();
    showNotify('ดาวน์โหลดสำเร็จ');
}

function checkWeeklyBackup() {
    if (!currentUser||currentUser.role!=='superadmin') return;
    const now=Date.now(); const last=db.settings.lastBackupDate||0;
    // หากเกิน 7 วัน (7 * 24 * 60 * 60 * 1000 มิลลิวินาที) จะทำการแบคอัป
    if (now-last >= 7*24*60*60*1000) {
        db.settings.lastBackupDate=now; saveDB();
        showNotify('กำลังสร้างไฟล์สำรองข้อมูลรายสัปดาห์อัตโนมัติ...');
        const csv=generateCSVContent();
        const fn=`ออมทอง_Backup_Weekly_${new Date().toLocaleDateString('th-TH').replace(/\//g,'-')}.csv`;
        
        if (db.settings.tgChatId) {
            sendTelegramDocument(csv, fn);
        }
        downloadCSV(csv, fn);
    }
}

    document.getElementById('shop-tagline-display').innerText = s.shopTagline;
    const pinLockEl = document.getElementById('pin-lock-shop-name');
    if (pinLockEl) pinLockEl.innerText = s.shopName;
    if (s.shopLogo) {
        document.getElementById('shop-logo-nav-container').innerHTML   = `<img src="${s.shopLogo}" style="width:100%;height:100%;object-fit:cover;">`;
        document.getElementById('shop-logo-login-container').innerHTML = `<img src="${s.shopLogo}" style="width:100%;height:100%;object-fit:cover;">`;
    }
}

function closeModal() { document.getElementById('modal-overlay').style.display='none'; }

function renderNav() {
    const nav = document.getElementById('navigation-bar');
    const user = getUser();
    const isAdmin = user&&(user.role==='superadmin'||user.role==='admin');
    const pendingCount = db.transactions.filter(t=>t.status==='pending').length;
    const items = isAdmin ? [
        { id:'home',     label:'หน้าหลัก', icon:'M3 12l9-9 9 9' },
        { id:'approve',  label:`อนุมัติ${pendingCount>0?` (${pendingCount})`:''}`, icon:'M9 12l2 2 4-4' },
        { id:'users',    label:'จัดการ',   icon:'M17 20H3v-1a6 6 0 0112 0v1M9 7a4 4 0 100 8 4 4 0 000-8z' },
        { id:'settings', label:'ตั้งค่า',  icon:'M12 15a3 3 0 100-6 3 3 0 000 6z' }
    ] : [
        { id:'home',    label:'หน้าแรก', icon:'M3 12l9-9 9 9' },
        { id:'deposit', label:'ฝากออม',  icon:'M12 5v14M5 12l7 7 7-7' },
        { id:'history', label:'ประวัติ',  icon:'M12 8v4l3 3' },
        { id:'profile', label:'โปรไฟล์', icon:'M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2' }
    ];
    nav.innerHTML = items.map(i=>`<button class="nav-item ${activePage===i.id?'active':''}" onclick="navigate('${i.id}')"><svg class="icon" viewBox="0 0 24 24"><path d="${i.icon}" stroke-linecap="round" stroke-linejoin="round"/></svg><span style="font-size:0.65rem;">${i.label}</span></button>`).join('');
}

// ─── NAVIGATION ──────────────────────────────────────────────
function navigate(page) {
    activePage = page; historyFilter = 'all'; userSearchQ = '';
    renderView(); renderNav(); window.scrollTo(0,0);
    resetInactivityTimer();
}

function renderView() {
    const user = getUser();
    if (!user) return handleLogout();
    currentUser = user;
    const container = document.getElementById('view-container');
    const isAdmin = user.role === 'superadmin' || user.role === 'admin';
    
    if (isAdmin) {
        switch(activePage) {
            case 'home':     container.innerHTML = renderAdminDashboard(); break;
            case 'approve':  container.innerHTML = renderAdminApprove(); break;
            case 'users':    container.innerHTML = renderAdminUsers(); break;
            case 'settings': container.innerHTML = renderAdminSettings(); break;
        }
    } else {
        switch(activePage) {
            case 'home':    container.innerHTML = renderCustomerHome(); break;
            case 'deposit': container.innerHTML = renderDepositForm(); break;
            case 'history': container.innerHTML = renderHistory(); break;
            case 'profile': container.innerHTML = renderProfile(); break;
        }
    }
}

// ─── AUTH ────────────────────────────────────────────────────
function setLoginMode(mode) {
    loginMode = mode;
    document.querySelectorAll('.login-tab').forEach(t => {
        t.classList.toggle('active', (mode === 'login' && t.innerText.includes('เข้า')) || (mode === 'register' && t.innerText.includes('สมัคร')));
    });
    document.getElementById('reg-name-group').style.display       = mode === 'register' ? 'block' : 'none';
    document.getElementById('reg-admin-code-group').style.display = (mode === 'register' && !hasSuperAdmin()) ? 'block' : 'none';
}

async function handleAuth() {
    const phone = document.getElementById('login-phone').value.trim();
    const pass  = document.getElementById('login-pass').value;
    if (!phone || !pass) return showNotify('กรุณากรอกข้อมูลให้ครบ', 'error');
    
    if (loginMode === 'login') {
        const user = db.users[phone];
        if (!user) return showNotify('ไม่พบบัญชีนี้ในระบบ', 'error');
        
        let ok = false;
        if (user.passHash) { 
            ok = await verifyPassword(pass, user.passHash); 
        } else { 
            ok = (user.pass === pass); 
            if (ok) { 
                user.passHash = await hashPassword(pass); 
                delete user.pass; 
                saveDB(); 
            } 
        }
        
        if (!ok) return showNotify('รหัสผ่านไม่ถูกต้อง', 'error');
        saveSession(phone); currentUser = user;
    } else {
        const name = document.getElementById('reg-name').value.trim();
        if (!name) return showNotify('กรุณากรอกชื่อ-นามสกุล', 'error');
        if (db.users[phone]) return showNotify('เบอร์นี้มีในระบบแล้ว', 'error');
        let role = 'customer';
        if (!hasSuperAdmin()) {
            const code = document.getElementById('reg-admin-code').value;
            if (code === '9999') { role = 'superadmin'; }
            else if (code !== '') return showNotify('รหัสตั้งต้นระบบไม่ถูกต้อง', 'error');
        }
        const passHash = await hashPassword(pass);
        db.users[phone] = { uid:'u'+Date.now(), phone, name, role, balanceTHB:0, balanceGold:0, passHash, email:'', profilePic:null, telegramChatId:null };
        saveDB(); saveSession(phone); currentUser = db.users[phone];
        if (role === 'superadmin') showNotify('คุณได้รับสิทธิ์ Super Admin แล้ว!');
    }
    initApp();
}

async function handleLineLogin() {
    const key = "line_user_001";
    if (!db.users[key]) {
        const h = await hashPassword("linepass");
        db.users[key] = { uid:'line_'+Date.now(), phone:key, name:"ผู้ใช้ LINE (Demo)", role:"customer", balanceTHB:0, balanceGold:0, passHash:h, email:"", profilePic:"https://upload.wikimedia.org/wikipedia/commons/4/41/LINE_logo.svg", telegramChatId:null };
        saveDB();
    }
    saveSession(key); currentUser = db.users[key];
    showNotify('เข้าสู่ระบบด้วย LINE สำเร็จ'); initApp();
}

function handleLogout() {
    clearTimeout(_inactivityTimer);
    clearSession(); currentUser = null;
    _pinLockActive = false;
    document.getElementById('pin-lock-overlay').style.display = 'none';
    document.getElementById('app-layout').style.display = 'none';
    document.getElementById('login-page').style.display = 'flex';
    document.getElementById('login-phone').value = '';
    document.getElementById('login-pass').value = '';
    setLoginMode('login');
}

// ─── INIT ─────────────────────────────────────────────────────
function initApp() {
    currentUser = getUser();
    if (!currentUser) return handleLogout();
    document.getElementById('login-page').style.display  = 'none';
    document.getElementById('app-layout').style.display  = 'flex';
    document.getElementById('display-user-name').innerText = currentUser.name;
    document.getElementById('display-user-avatar').innerHTML = currentUser.profilePic
        ? `<img src="${currentUser.profilePic}" style="object-fit:cover;width:100%;height:100%;">`
        : currentUser.name[0];
    updateShopIdentity();
    fetchLiveGoldPrice().then(() => navigate('home'));
    resetInactivityTimer(); 
    
    // เรียกตรวจเช็ค Weekly Backup หลังล็อกอินเสร็จ 1.5 วินาที
    setTimeout(checkWeeklyBackup, 1500);
}

window.onload = () => {
    updateShopIdentity();
    if (sessionPhone && db.users[sessionPhone]) {
        initApp();
    } else {
        clearSession();
    }
};
</script>
